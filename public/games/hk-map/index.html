:root{
  --ink:#241a12;--navy:#1d2340;--navy2:#2a3366;--navy3:#3c4680;--edge:#f4e9c8;--cream:#fff6dc;--paper:#fbf3dd;--paper2:#f1e5c4;
  --dim:#b9bedc;--gold:#f6c945;--gold2:#c8961e;--red:#e8463c;--red2:#ff7a6e;--green:#5cc46a;--green2:#7be38a;--sea:#34628f;
  --font:FP,FP2,"PingFang HK","Noto Sans HK",sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sea);color:var(--cream);font-family:var(--font);font-size:12px;-webkit-font-smoothing:none;overscroll-behavior:none;touch-action:none}
button{font-family:var(--font)}
/* everything lives in #ui, which tracks the part of the screen not covered by the keyboard */
#ui{position:fixed;left:0;top:0;width:100%;height:var(--vvh,100%);transform:translate3d(0,var(--vvt,0px),0);z-index:1;overflow:hidden}
#map{position:absolute;inset:0}
#map canvas{image-rendering:pixelated;display:block}
.ic{display:inline-block;width:16px;height:16px;vertical-align:-3px;flex:none}
.ic svg{width:100%;height:100%;display:block;shape-rendering:crispEdges}
.y{color:var(--gold)} .en{color:var(--dim)} .ok{color:var(--green2)} .bad{color:var(--red2)} .tone{color:var(--gold)}
.big{font-size:24px} .huge{font-size:48px;line-height:1}
/* panels */
.panel{background:var(--navy);border:3px solid var(--edge);box-shadow:0 0 0 2px var(--navy3) inset,5px 5px 0 rgba(5,7,15,.85)}
.paper{background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:5px 5px 0 rgba(5,7,15,.75)}
.btn{display:flex;align-items:center;gap:8px;justify-content:center;font:12px var(--font);color:var(--cream);background:var(--navy2);border:3px solid var(--edge);padding:10px 12px;min-height:44px;cursor:pointer;box-shadow:3px 3px 0 rgba(5,7,15,.9);text-align:left;line-height:1.35}
.btn:hover{filter:brightness(1.15)} .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(5,7,15,.9)}
.btn.primary{background:var(--red);border-color:var(--cream)}
.btn.gold{background:var(--gold);color:var(--ink);border-color:var(--ink)}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--navy3)}
.btn.sm{min-height:34px;padding:6px 8px}
.btn .lbl{display:flex;flex-direction:column}
.btn .lbl b{font-weight:normal;font-size:24px;line-height:1.05}
.btn .lbl small{font-size:12px;color:var(--dim)}
.btn.primary .lbl small,.btn.gold .lbl small{color:inherit;opacity:.85}
.btn .ic{width:24px;height:24px}
.btn[disabled]{opacity:.45;pointer-events:none}
.kbd{display:none;font-size:12px;color:var(--dim);padding:0 2px;margin-left:auto}
@media (hover:hover) and (pointer:fine){.kbd{display:inline-block}}
/* hud */
#hud{position:fixed;top:calc(8px + var(--safe-t));left:calc(8px + var(--safe-l));right:calc(8px + var(--safe-r));display:flex;gap:8px;align-items:stretch;z-index:3;pointer-events:none}
#hud>*{pointer-events:auto}
#hud .bar{flex:1;display:flex;align-items:center;gap:10px;padding:6px 10px;min-height:44px;min-width:0}
#hud .bar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .q{flex:1;padding:8px 12px;min-width:0}
#hud .q .big{line-height:1.2}
.iconbtn{width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--cream);padding:0}
button.iconbtn:not(.panel){background:none;border:none}
.iconbtn .ic{width:24px;height:24px}
.dots{display:flex;gap:3px;align-items:center;flex:1;min-width:60px;max-width:420px;margin-left:auto}
.dots i{flex:1;height:6px;background:#2b3550;border:1px solid #05070f}
.dots i.d{background:var(--cream)} .dots i.c{background:var(--gold);height:10px}
.timer{height:10px;background:#05070f;border:2px solid var(--edge);margin-top:6px} .timer i{display:block;height:100%;background:var(--green)}
.timer.low i{background:var(--red)}
/* sheet */
#sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + var(--safe-b));width:min(760px,calc(100% - 16px - var(--safe-l) - var(--safe-r)));z-index:4;max-height:calc(100% - 70px - var(--safe-t));overflow:auto;padding:12px 14px}
#sheet[hidden],#hud[hidden],#side[hidden],#center[hidden],#pad[hidden]{display:none}
.band{height:6px;margin:-12px -14px 10px}
.stop{display:flex;gap:12px;align-items:flex-start}
.stop .thumb{width:92px;height:68px;object-fit:cover;border:2px solid var(--edge);flex:none;display:none;background:#c9c2ae}
.stop .main{flex:1;min-width:0}
.stop .hz{font-size:48px;line-height:1.05}
.stop .hz.long{font-size:24px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.chip{font-size:12px;color:#fff;padding:2px 6px;border:1px solid #05070f;white-space:nowrap}
.fact{color:#d6daf2;line-height:1.6;margin-top:6px}
.stars{color:var(--gold);white-space:nowrap}
.badge{color:var(--gold)} .badge.seen{color:var(--green2)}
.row{display:flex;gap:8px;align-items:center}
.spacer{flex:1}
/* typebar */
.tb{margin-top:10px;border-top:2px dashed var(--navy3);padding-top:10px}
.tb-hint{font-size:24px;color:var(--gold);min-height:28px;letter-spacing:1px;word-break:break-word}
.tb-row{display:flex;gap:6px;margin-top:6px}
.tb-in{flex:1;min-width:0;font:24px var(--font);color:var(--cream);background:#0e1330;border:3px solid var(--edge);padding:8px 10px;outline:none;border-radius:0;-webkit-appearance:none}
.tb-in:focus{border-color:var(--gold)} .tb-in.ok{border-color:var(--green2)} .tb-in.bad{border-color:var(--red2);animation:shake .25s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tb-tones{display:flex;gap:4px;margin-top:6px}
.tb-tones button{flex:1;min-height:40px;font:12px var(--font);color:var(--cream);background:var(--navy3);border:2px solid var(--edge);cursor:pointer}
.tb-tones button b{display:block;font-weight:normal;font-size:24px;line-height:1}
.tb-msg{margin-top:6px;color:var(--dim);min-height:14px;line-height:1.5}
/* side: photo + fact */
#side{position:fixed;right:calc(10px + var(--safe-r));top:calc(66px + var(--safe-t));width:290px;z-index:3;padding:10px;max-height:calc(100% - 150px);overflow:auto}
#side img.ph{display:block;width:100%;height:160px;object-fit:cover;border:2px solid var(--ink);background:#c9c2ae}
#side .hz{font-size:24px;margin-top:8px;line-height:1.15}
#side .yl{color:#8a5400;margin-top:3px}
#side .en2{color:#555;margin-top:3px}
#side .tx{line-height:1.65;margin-top:8px}
#side .cr{font:10px sans-serif;color:#7a7466;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#side .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.fcard img.ph{display:block;width:100%;height:160px;object-fit:cover;border:2px solid var(--ink);background:#c9c2ae}
.fcard .hz{font-size:24px;margin-top:8px;line-height:1.15}
.fcard .yl{color:#8a5400;margin-top:3px}
.fcard .en2{color:#555;margin-top:3px}
.fcard .tx{line-height:1.65;margin-top:8px}
.fcard .cr{font:10px sans-serif;color:#7a7466;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.fcard .tags .chip{white-space:normal;line-height:1.35}
.fcard .row .btn.sm{flex:none}
#side.polaroid{padding:10px 10px 6px;transform:rotate(1.5deg)}
#side.polaroid .cap{font-size:24px;margin-top:6px}
.slide{animation:slidein .25s ease-out}
@keyframes slidein{from{opacity:0;transform:translateY(-14px)}to{opacity:1}}
/* center: home, journey, menus */
#center{position:fixed;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;padding:calc(10px + var(--safe-t)) calc(10px + var(--safe-r)) calc(10px + var(--safe-b)) calc(10px + var(--safe-l));pointer-events:none}
#center>*{pointer-events:auto}
.home{width:min(560px,100%);max-height:100%;overflow:auto;padding:18px 18px 14px}
.logo{font-size:72px;line-height:1;text-align:center;letter-spacing:4px;text-shadow:4px 4px 0 #05070f}
.logo-sub{text-align:center;color:var(--gold);margin-top:8px}
.rank{margin:14px 0 10px}
.xp{height:12px;background:#05070f;border:2px solid var(--edge);margin:6px 0 4px} .xp i{display:block;height:100%;background:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.missions{margin-top:12px;padding:10px;background:#141a35;border:2px solid var(--navy3)}
.mis{display:flex;gap:8px;align-items:center;margin-top:8px}
.mis .box{width:16px;height:16px;border:2px solid var(--edge);flex:none} .mis.done .box{background:var(--green)}
.mis .pb{height:6px;background:#05070f;margin-top:4px} .mis .pb i{display:block;height:100%;background:var(--gold)} .mis.done .pb i{background:var(--green)}
.foot{color:#7f86ad;text-align:center;margin-top:12px;line-height:1.5}
.menu{width:min(620px,100%);max-height:100%;overflow:auto;padding:16px}
.menu h2,.home h2{font-weight:normal;font-size:24px;margin:0}
.hd{display:flex;align-items:center;gap:10px}
.hd .iconbtn{margin-left:auto}
/* home: one big next-step button, three everyday modes, the rest folded under "More" */
.cont{display:flex;flex-direction:column;align-items:stretch;gap:4px;width:100%;margin-top:14px;padding:12px 14px;text-align:left;font:12px var(--font);color:var(--cream);background:var(--navy2);border:3px solid var(--gold);box-shadow:4px 4px 0 rgba(5,7,15,.9);cursor:pointer}
.cont:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(5,7,15,.9)}
.cont .lvtag{color:var(--dim)} .cont .cz{font-size:24px;line-height:1.15}
.cont .pgbar{margin:6px 0 4px;height:8px}
.cont .cgo{display:flex;align-items:center;gap:8px;background:var(--red);border:3px solid var(--cream);margin:4px -2px 0;padding:8px 10px}
.cont .cgo b{font-weight:normal;font-size:24px;white-space:nowrap} .cont .cgo span{opacity:.9;line-height:1.3} .cont .cgo .ic{width:24px;height:24px}
.lnk{margin-top:10px} .link{background:none;border:none;color:var(--gold);font:12px var(--font);padding:6px 0;cursor:pointer;display:flex;gap:6px;align-items:center;min-height:32px}
.home .xp{margin:4px 0 10px;height:6px}
.qrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qrow .btn{flex-direction:column;gap:4px;padding:8px 4px;text-align:center} .qrow .btn .lbl{align-items:center}
.qrow .btn.sm .lbl b{font-size:12px}
details.more{margin-top:10px} details.more summary{list-style:none;cursor:pointer;color:var(--dim);padding:8px 0;display:flex;gap:6px;align-items:center;min-height:36px}
details.more summary::-webkit-details-marker{display:none} details.more[open] summary{color:var(--cream)}
details.more .missions{margin-top:10px}
.lvbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.lv .lz{font-size:24px;line-height:1.1}
.more-lv{cursor:pointer}
/* journey: a metro line */
.metro{position:relative;margin-top:12px;padding-left:4px}
.lv{position:relative;display:flex;gap:12px;align-items:center;padding:8px 6px 8px 46px;cursor:pointer;min-height:58px}
.lv:hover{background:#252c55}
.lv::before{content:"";position:absolute;left:19px;top:0;bottom:0;width:8px;background:var(--navy3)}
.lv.done::before{background:var(--gold)}
.lv:first-child::before{top:50%} .lv:last-child::before{bottom:50%}
.lv .st{position:absolute;left:8px;top:50%;margin-top:-15px;width:30px;height:30px;border-radius:50%;background:var(--cream);border:3px solid #05070f;color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:12px}
.lv.done .st{background:var(--green);color:#fff} .lv.cur .st{background:var(--gold);box-shadow:0 0 0 4px rgba(246,201,69,.35);animation:pulse 1.2s infinite} .lv.locked .st{background:#2b3050;color:#6d7290}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(246,201,69,0)}}
.lv .ti{flex:1;min-width:0} .lv .ti .big{line-height:1.1}
.lv.locked{cursor:default;opacity:.6}
.lv .pg{width:90px;text-align:right}
.pgbar{height:6px;background:#05070f;margin-top:4px} .pgbar i{display:block;height:100%;background:var(--gold)}
.ridegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:12px}
.ridegrid .btn{flex-direction:column;align-items:flex-start;gap:2px;border-left-width:10px}
.items{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.items span{padding:2px 6px;background:#141a35;border:1px solid var(--navy3)}
.items span.m{color:var(--green2)} .items span.u{color:#6d7290}
.end{width:min(460px,100%);padding:20px;text-align:center}
.end .big{margin-top:8px}
.end .btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:16px}
/* touch pad for free roam */
#pad{position:fixed;left:calc(14px + var(--safe-l));bottom:calc(14px + var(--safe-b));z-index:4}
#pad button{background:rgba(29,35,64,.85);border:3px solid var(--edge);color:var(--cream);font:24px var(--font);touch-action:none}
#pad button:active,#pad button.on{background:var(--gold);color:var(--ink)}
#pad .run{font-size:12px}
#visit{position:fixed;right:calc(12px + var(--safe-r));bottom:calc(16px + var(--safe-b));z-index:4}#travel{position:fixed;right:calc(12px + var(--safe-r));bottom:calc(76px + var(--safe-b));z-index:4}
/* free-roam thumb stick */

#pad .stick{position:relative;width:132px;height:132px;border-radius:50%;background:rgba(29,35,64,.72);border:3px solid var(--edge);box-shadow:4px 4px 0 rgba(5,7,15,.6);touch-action:none}
#pad .stick.on{background:rgba(29,35,64,.9)}
#pad .knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:var(--gold);border:3px solid var(--ink);transition:transform .06s}
#pad .stick b{position:absolute;color:var(--dim);font-weight:normal;font-size:12px;pointer-events:none}
#pad .au{left:50%;top:6px;transform:translateX(-50%)} #pad .ad{left:50%;bottom:6px;transform:translateX(-50%)} #pad .al{left:8px;top:50%;transform:translateY(-50%)} #pad .ar{right:8px;top:50%;transform:translateY(-50%)}
/* compact fact card in the bottom sheet (phones) */
.fsheet{margin:-12px -14px;padding:10px 12px;border:none;box-shadow:none}
.fmini{display:flex;gap:10px;align-items:flex-start}
.fmini .fth{width:96px;height:72px;object-fit:cover;border:2px solid var(--ink);flex:none;background:#c9c2ae;cursor:zoom-in}
.fmini .fth.open{position:fixed;left:8px;right:8px;top:calc(60px + var(--safe-t));width:auto;height:auto;max-height:55%;z-index:9;cursor:zoom-out;box-shadow:6px 6px 0 rgba(5,7,15,.8)}
.fmini .fmain{flex:1;min-width:0} .fmini .row .iconbtn{width:36px;min-height:32px;margin:-6px -6px 0 0;color:var(--ink)}
.fdist{color:#6b665b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:6px}
.fhz{font-size:24px;line-height:1.15;margin-top:2px} .fyl{color:#8a5400} .fen{color:#555}
.ftx{line-height:1.6;margin-top:8px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.fcr{font:10px sans-serif;color:#7a7466;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.roam #bao,body.factopen #pad,body.factopen #visit,body.factopen #zoom,body.factopen #bao{display:none!important}
@media (max-width:700px){ .rmt{display:none} #rw{color:var(--cream)} }
#zoom{position:fixed;right:calc(12px + var(--safe-r));z-index:3;display:flex;flex-direction:column;gap:6px}
#zoom .btn{width:44px;padding:0}
/* mascot */
#bao{position:fixed;left:calc(12px + var(--safe-l));z-index:5;display:flex;align-items:flex-end;gap:8px;pointer-events:none;transition:bottom .2s}
#bao img{width:64px;height:64px;image-rendering:pixelated;animation:bob 1s ease-in-out infinite alternate}
#bao .bub{background:var(--paper);color:var(--ink);border:3px solid var(--ink);padding:8px 10px;box-shadow:4px 4px 0 rgba(5,7,15,.8);max-width:240px;margin-bottom:34px;position:relative}
#bao .bub::before{content:"";position:absolute;left:-12px;bottom:10px;border:6px solid transparent;border-right-color:var(--ink)}
#bao .bub b{display:block;font-weight:normal;font-size:24px} #bao .bub i{display:block;font-style:normal;color:#8a5400} #bao .bub s{display:block;text-decoration:none;color:#555}
@keyframes bob{to{transform:translateY(-4px)}}
#bao.pop img{animation:pop .3s}
@keyframes pop{40%{transform:scale(1.2,.8)}}
/* toasts */
#toasts{position:fixed;top:calc(64px + var(--safe-t));right:calc(10px + var(--safe-r));z-index:8;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{background:#2a1d4a;border:3px solid var(--gold);padding:8px 14px;box-shadow:4px 4px 0 rgba(5,7,15,.85);text-align:center;animation:tin .25s ease-out;max-width:320px}
.toast b{display:block;font-weight:normal;font-size:24px} .toast i{display:block;font-style:normal;color:var(--gold)} .toast s{display:block;text-decoration:none;color:var(--dim)}
@keyframes tin{from{opacity:0;transform:scale(.7)}}
.banner{position:fixed;left:50%;top:calc(70px + var(--safe-t));transform:translateX(-50%);z-index:6;text-align:center;padding:8px 14px;animation:bannerin 2.6s ease-in-out forwards;pointer-events:none;width:max-content;max-width:calc(100% - 24px);line-height:1.4}
@keyframes bannerin{0%{opacity:0;transform:translate(-50%,-30px)}12%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-20px)}}
.stamp{position:fixed;left:50%;top:38%;z-index:9;width:110px;height:110px;margin:-55px;border:6px double #d0312d;border-radius:50%;color:#d0312d;font-size:48px;display:flex;align-items:center;justify-content:center;background:rgba(251,243,221,.85);transform:rotate(-14deg);animation:stampin .35s ease-in;pointer-events:none}
@keyframes stampin{from{transform:rotate(-14deg) scale(3);opacity:0}}
/* modal */
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(11,15,34,.8);z-index:7;padding:calc(10px + var(--safe-t)) 10px calc(10px + var(--safe-b))}
#modal .box{width:min(640px,100%);max-height:100%;overflow:auto;padding:18px 20px}
#modal .box.wide{width:min(1100px,100%);height:100%}
#modal h3{font-size:12px;font-weight:normal;color:var(--gold);margin:18px 0 6px}
#modal p{line-height:1.7;color:var(--dim);margin:4px 0}
#modal label{display:block;margin:8px 0 4px}
#modal input,#modal select,#modal textarea{width:100%;font:16px var(--font);color:var(--cream);background:#0e1330;border:3px solid var(--edge);padding:8px;border-radius:0}
#modal textarea{height:80px;font-size:12px}
.rowb{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.stt{color:var(--gold);margin-top:6px;min-height:14px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tabs .btn{min-height:34px;padding:6px 8px}
.tabs .btn.on{background:var(--gold);color:var(--ink)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:14px}
.card{background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 rgba(5,7,15,.8);padding:6px;cursor:pointer;position:relative}
.card img{width:100%;height:86px;object-fit:cover;display:block;background:#c9c2ae;border:2px solid var(--ink)}
.card.locked{cursor:default} .card.locked img{filter:brightness(.1) contrast(1.6)}
.card .hz{font-size:24px;margin-top:5px;line-height:1.1;word-break:break-all}
.card .yl{color:#8a5400;min-height:14px}
.card .en{font:10px sans-serif;color:#6b665b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .lb{height:5px;margin:-6px -6px 6px}
.card .sx{position:absolute;right:8px;top:56px;width:42px;height:42px;border:3px double #d0312d;border-radius:50%;color:#d0312d;font-size:24px;display:flex;align-items:center;justify-content:center;transform:rotate(-14deg);background:rgba(251,243,221,.85)}
.card .go{position:absolute;right:10px;top:10px;background:var(--navy);color:var(--cream);padding:2px 4px;border:2px solid var(--cream)}
/* splash */
#splash{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(11,15,34,.88);cursor:pointer;text-align:center;padding:20px}
#splash .k{color:var(--dim);animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--navy);z-index:11}
@media (max-width:700px){
  #center{align-items:flex-end}
  .home{padding:14px 12px 10px} .home .logo{font-size:48px} .logo-sub{margin-top:4px}
  .menu{padding:12px} .lv{min-height:50px;padding:6px 4px 6px 46px} .lv .pg{width:64px}

  .logo{font-size:48px} .stop .hz{font-size:24px} .huge{font-size:24px}
  #side{display:none}
  .stop .thumb{display:block}
  #bao img{width:48px;height:48px} #bao .bub{max-width:200px;margin-bottom:24px}
  #toasts{left:10px;right:10px;align-items:center}
}
/* phone held sideways (set from JS, so the keyboard never triggers it) */
body.land #sheet{left:auto;right:calc(8px + var(--safe-r));transform:none;width:min(460px,54%);top:calc(8px + var(--safe-t));bottom:calc(8px + var(--safe-b));max-height:none;padding:10px 12px}
body.land #hud{right:calc(min(460px,54%) + 18px + var(--safe-r))}
body.land .tb-tones button{min-height:34px}
body.short .home .logo,body.short .home .logo-sub{display:none}
body.short .cont{margin-top:0}
body.short .home{padding:10px 12px}
body.short .cont{padding:8px 10px;gap:2px}
